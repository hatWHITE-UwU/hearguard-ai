name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/hearguard_test_ci
          JWT_SECRET: test_jwt_secret_min_32_chars_long_abc123
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_chars_long
          FRONTEND_URL: http://localhost:4200
          AI_SERVICE_URL: http://localhost:5001
          NODE_ENV: test
      - name: Check backend coverage threshold (≥ 60%)
        run: |
          LINES=$(node -e "
            const fs = require('fs');
            const lcov = fs.readFileSync('coverage/lcov.info', 'utf8');
            const found = (lcov.match(/^LF:\d+/gm) || []).reduce((s, l) => s + parseInt(l.slice(3)), 0);
            const hit   = (lcov.match(/^LH:\d+/gm) || []).reduce((s, l) => s + parseInt(l.slice(3)), 0);
            const pct = found ? Math.round(hit / found * 100) : 0;
            console.log(pct);
          ")
          echo "Backend line coverage: ${LINES}%"
          if [ "$LINES" -lt 60 ]; then
            echo "FAIL: coverage ${LINES}% is below the 60% threshold"
            exit 1
          fi
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 1

  # ── AI Service ───────────────────────────────────────────────────────────────
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m model.trainer
      - run: pytest tests/ -q --cov=model --cov-report=xml:coverage.xml --cov-fail-under=60
      - name: Upload AI coverage
        uses: actions/upload-artifact@v4
        with:
          name: ai-coverage
          path: ai-service/coverage.xml
          retention-days: 1

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test:ci -- --browsers=chromium
      - run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 1

  # ── E2E tests (Playwright — against Vercel preview) ──────────────────────────
  e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package.json
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Run E2E tests against Vercel
        run: npx playwright test --project=chromium
        env:
          BASE_URL: ${{ secrets.VERCEL_FRONTEND_URL || 'https://frontend-tau-tan-95.vercel.app' }}
        continue-on-error: true
      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/e2e-html/
          retention-days: 7

  # ── Flutter ──────────────────────────────────────────────────────────────────
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage

  # ── SonarCloud ───────────────────────────────────────────────────────────────
  # CI-based analysis (reemplaza al Automatic Analysis del GitHub App).
  # Necesita que se cumpla TODO esto:
  #   1. SONAR_TOKEN en GitHub Secrets (Settings → Secrets and variables → Actions).
  #   2. Automatic Analysis DESACTIVADO en SonarCloud
  #      (Project → Administration → Analysis Method).
  #   3. sonar-project.properties con las rutas de los reportes lcov / coverage.xml.
  # Aquí descargamos los artefactos de cobertura de los jobs anteriores y los
  # colocamos en las rutas que espera sonar-project.properties.
  sonarcloud:
    name: SonarCloud analysis + coverage
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
      - name: Download AI coverage
        uses: actions/download-artifact@v4
        with:
          name: ai-coverage
          path: ai-service
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
        continue-on-error: true
      - name: Verify coverage files
        run: |
          echo "── Coverage report tree ──"
          ls -la backend/coverage/ || echo "no backend coverage"
          ls -la frontend/coverage/ || echo "no frontend coverage"
          ls -la ai-service/coverage.xml || echo "no AI coverage"
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy backend to Render
        run: curl -s "${{ secrets.RENDER_BACKEND_HOOK }}"
      - name: Deploy AI service to Render
        run: curl -s "${{ secrets.RENDER_AI_HOOK }}"
      - name: Deploy frontend to Vercel
        run: curl -s "${{ secrets.VERCEL_FRONTEND_HOOK }}"
