name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          MONGO_URI: mongodb://127.0.0.1:27017/hearguard_test_ci
          JWT_SECRET: test_jwt_secret_min_32_chars_long_abc123
          JWT_REFRESH_SECRET: test_refresh_secret_min_32_chars_long
          FRONTEND_URL: http://localhost:4200
          AI_SERVICE_URL: http://localhost:5001
          NODE_ENV: test
      - name: Check backend coverage threshold (≥ 60%)
        run: |
          LINES=$(node -e "
            const fs = require('fs');
            const lcov = fs.readFileSync('coverage/lcov.info', 'utf8');
            const found = (lcov.match(/^LF:\d+/gm) || []).reduce((s, l) => s + parseInt(l.slice(3)), 0);
            const hit   = (lcov.match(/^LH:\d+/gm) || []).reduce((s, l) => s + parseInt(l.slice(3)), 0);
            const pct = found ? Math.round(hit / found * 100) : 0;
            console.log(pct);
          ")
          echo "Backend line coverage: ${LINES}%"
          if [ "$LINES" -lt 60 ]; then
            echo "FAIL: coverage ${LINES}% is below the 60% threshold"
            exit 1
          fi
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          retention-days: 1

  # ── AI Service ───────────────────────────────────────────────────────────────
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m model.trainer
      - run: pytest tests/ -q --cov=app --cov=model --cov-report=xml:coverage.xml --cov-fail-under=60
      - name: Upload AI coverage
        uses: actions/upload-artifact@v4
        with:
          name: ai-coverage
          path: ai-service/coverage.xml
          retention-days: 1

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run test:ci -- --browsers=chromium
      - name: Fix lcov paths for SonarCloud
        if: always()
        run: node ../scripts/fix-sonar-coverage-paths.js
      - run: npm run build
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/hearguard-frontend/lcov.info
          if-no-files-found: ignore
          retention-days: 1

  # ── E2E tests (Playwright — against Vercel, AFTER deploy) ───────────────────
  # Corre solo en main push, después de que deploy dispare los hooks,
  # para testear la versión realmente desplegada (no la anterior).
  e2e:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package.json
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Wait for Vercel deployment to be ready
        run: sleep 90
      - name: Run E2E tests against Vercel
        run: npx playwright test --project=chromium
        env:
          BASE_URL: ${{ secrets.VERCEL_FRONTEND_URL || 'https://frontend-tau-tan-95.vercel.app' }}
      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: reports/e2e-html/
          retention-days: 7

  # ── K6 Performance smoke (against deployed backend) ──────────────────────────
  # Corre solo en main push, después de deploy, para validar los RNFs de
  # performance en producción. Solo ejecuta el escenario smoke (30 s, 1 VU).
  k6-smoke:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Wait for backend to be ready
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.BACKEND_URL }}/health" || echo 000)
            echo "Attempt $i: HTTP $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 15
          done
          echo "Backend not ready after 7.5 minutes"
          exit 1
      - name: Run K6 smoke test against production
        shell: bash
        run: |
          set -o pipefail
          k6 run --env K6_SMOKE_ONLY=true tests/k6/load-test.js 2>&1 | tee k6-smoke-output.txt
        env:
          BASE_URL: ${{ secrets.BACKEND_URL }}
      - name: Upload K6 smoke report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-smoke-report
          path: k6-smoke-output.txt
          retention-days: 7

  # ── Lighthouse (performance audit — against deployed Vercel frontend) ────────
  # Corre solo en main push, después de deploy. Falla si accessibility < 90 %.
  # Performance / Best-Practices / SEO emiten warning pero no bloquean.
  lighthouse:
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Vercel deployment to be ready
        run: sleep 90
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: ${{ secrets.VERCEL_FRONTEND_URL || 'https://frontend-tau-tan-95.vercel.app' }}
          configPath: .lighthouserc.json
          temporaryPublicStorage: true
          uploadArtifacts: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Flutter ──────────────────────────────────────────────────────────────────
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --coverage

  # ── SonarCloud ───────────────────────────────────────────────────────────────
  # CI-based analysis (reemplaza al Automatic Analysis del GitHub App).
  # Requisitos para que este job pase:
  #   1. Secret SONAR_TOKEN en el repo (Settings → Secrets and variables → Actions).
  #   2. Automatic Analysis DESACTIVADO en SonarCloud
  #      (Project → Administration → Analysis Method).
  #   3. sonar-project.properties con las rutas de los reportes lcov / coverage.xml.
  # Aquí descargamos los artefactos de cobertura de los jobs anteriores y los
  # colocamos en las rutas que espera sonar-project.properties.
  sonarcloud:
    name: SonarCloud analysis + coverage
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
      - name: Download AI coverage
        uses: actions/download-artifact@v4
        with:
          name: ai-coverage
          path: ai-service
      - name: Download frontend coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/hearguard-frontend
        continue-on-error: true
      - name: Fix lcov paths for SonarCloud
        run: node scripts/fix-sonar-coverage-paths.js
      - name: Verify coverage files
        run: |
          echo "── Coverage report tree ──"
          ls -la backend/coverage/ || echo "no backend coverage"
          ls -la frontend/coverage/hearguard-frontend/ || echo "no frontend coverage"
          ls -la ai-service/coverage.xml || echo "no AI coverage"
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ── Deploy ───────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy backend to Render
        run: curl -s "${{ secrets.RENDER_BACKEND_HOOK }}"
      - name: Deploy AI service to Render
        run: curl -s "${{ secrets.RENDER_AI_HOOK }}"
      - name: Deploy frontend to Vercel
        run: curl -s "${{ secrets.VERCEL_FRONTEND_HOOK }}"
