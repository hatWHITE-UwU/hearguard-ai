name: Generate Flutter pubspec.lock

on:
  workflow_dispatch:

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Generate pubspec.lock
        run: flutter pub get

      - name: Commit pubspec.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git diff --staged --quiet || git commit -m "chore(flutter): commit pubspec.lock for reproducible dependency resolution (SonarCloud S8571)"
          git push
        working-directory: ${{ github.workspace }}
