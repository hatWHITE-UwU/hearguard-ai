name: Generate Flutter pubspec.lock

on:
  workflow_dispatch:

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.x"
          channel: stable
          cache: true

      - name: Generate pubspec.lock
        working-directory: flutter_app
        run: flutter pub get

      - name: Commit pubspec.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flutter_app/pubspec.lock
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "chore(flutter): commit pubspec.lock for reproducible dependency resolution (SonarCloud S8571)" && \
            git push origin HEAD:main
