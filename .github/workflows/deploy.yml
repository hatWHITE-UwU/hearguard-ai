name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip Docker build (use cached images)'
        type: boolean
        default: false

# ── Required GitHub Secrets ───────────────────────────────────────────────────
# RENDER_BACKEND_HOOK  → Render deploy-hook URL for the backend service
# RENDER_AI_HOOK       → Render deploy-hook URL for the AI service
# BACKEND_URL          → Public URL of the deployed backend (e.g. https://api.hearguard.onrender.com)
# VERCEL_TOKEN         → Vercel personal access token
# VERCEL_ORG_ID        → Vercel team/org ID (vercel env pull shows it)
# VERCEL_PROJECT_ID    → Vercel project ID
# ─────────────────────────────────────────────────────────────────────────────

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/hearguard-backend
  AI_IMAGE: ghcr.io/${{ github.repository_owner }}/hearguard-ai-service

jobs:
  # ── 1. Build & push Docker images to GHCR ─────────────────────────────────
  build-images:
    if: ${{ !inputs.skip_build }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest,${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push AI service
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ai-service.Dockerfile
          push: true
          tags: ${{ env.AI_IMAGE }}:latest,${{ env.AI_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 2. Deploy backend + AI service via Render deploy hooks ────────────────
  deploy-render:
    needs: [build-images]
    if: always() && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backend deploy on Render
        if: ${{ secrets.RENDER_BACKEND_HOOK != '' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_BACKEND_HOOK }}")
          echo "Render backend hook → HTTP $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || exit 1

      - name: Trigger AI service deploy on Render
        if: ${{ secrets.RENDER_AI_HOOK != '' }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_AI_HOOK }}")
          echo "Render AI hook → HTTP $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ] || exit 1

      - name: Skip notice (secrets not configured)
        if: ${{ secrets.RENDER_BACKEND_HOOK == '' }}
        run: echo "⚠️  RENDER_BACKEND_HOOK not set — skipping Render deploy."

  # ── 3. Build Angular & deploy to Vercel ───────────────────────────────────
  deploy-frontend:
    needs: [build-images]
    if: always() && (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Inject production API URL
        run: node scripts/set-env.js
        env:
          API_URL: ${{ secrets.BACKEND_URL }}

      - run: npm run build

      - name: Deploy to Vercel
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        run: npx vercel deploy dist/hearguard-frontend/browser --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Skip notice (secrets not configured)
        if: ${{ secrets.VERCEL_TOKEN == '' }}
        run: echo "⚠️  VERCEL_TOKEN not set — skipping Vercel deploy."
