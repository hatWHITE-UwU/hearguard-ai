sonar.projectKey=hatWHITE-UwU_hearguard-ai
sonar.organization=hatwhite-uwu
sonar.projectName=HearGuard AI
sonar.projectVersion=1.0

# ── Sources ───────────────────────────────────────────────────────────────────
sonar.sources=backend/src,frontend/src/app,ai-service

# ── Tests ─────────────────────────────────────────────────────────────────────
sonar.tests=backend/tests,flutter_app/test
sonar.test.inclusions=backend/tests/**/*.js,flutter_app/test/**/*.dart

# ── Exclusions ────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/node_modules/**,\
  **/.dart_tool/**,\
  **/build/**,\
  **/dist/**,\
  **/.angular/**,\
  **/coverage/**,\
  **/saved/**,\
  backend/src/services/ai.service.js,\
  tests/k6/**,\
  e2e/**

# ── Coverage exclusions ───────────────────────────────────────────────────────
# Archivos cuyo % de cobertura no debe contarse (no aportan al sistema): tests,
# mocks, scripts de configuracion, datos de demostracion, archivos generados.
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.test.js,\
  **/__tests__/**,\
  backend/tests/**,\
  backend/server.js,\
  backend/api/**,\
  frontend/src/main.ts,\
  frontend/src/app/app.config.ts,\
  frontend/src/app/app.routes.ts,\
  frontend/src/app/core/data/demo-mocks.ts,\
  frontend/src/app/features/**,\
  frontend/src/app/**/*.html,\
  frontend/src/app/**/*.scss,\
  frontend/scripts/**,\
  ai-service/tests/**,\
  ai-service/model/trainer.py,\
  flutter_app/test/**

# ── JavaScript / TypeScript coverage ──────────────────────────────────────────
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
# Angular 21 escribe lcov en coverage/<projectName>/ (no en coverage/ raíz).
sonar.typescript.lcov.reportPaths=frontend/coverage/hearguard-frontend/lcov.info

# ── Python ────────────────────────────────────────────────────────────────────
sonar.python.version=3.11
sonar.python.coverage.reportPaths=ai-service/coverage.xml

# ── Encoding ──────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
