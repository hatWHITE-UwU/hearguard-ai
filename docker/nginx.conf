events { worker_connections 1024; }
http {
  upstream api { server backend:3000; }
  upstream ai { server ai-service:5001; }
  server {
    listen 80;
    location /api/ai-py/ { rewrite ^/api/ai-py/(.*) /$1 break; proxy_pass http://ai; }
    location / { proxy_pass http://api; proxy_http_version 1.1; proxy_set_header Host $host; }
  }
}
